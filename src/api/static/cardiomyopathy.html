<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>心肌病全病程工作台</title><link rel="stylesheet" href="/static/style.css"><style>body{padding:28px;max-width:1200px;margin:auto}header,.context,.actions{display:flex;gap:16px;flex-wrap:wrap;align-items:center}section{border:1px solid #dbe2ea;padding:20px;margin:20px 0;border-radius:12px}label{display:block;margin:8px 0}input,select,textarea{padding:8px;max-width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #ddd}[role=status]{min-height:24px}button{border:1px solid #cbd5e1;border-radius:7px;padding:9px 14px;background:white;color:#23483d;cursor:pointer}button:hover{background:#e6f1eb}button:disabled{opacity:.5}section{background:white}section>label{display:inline-flex;flex-direction:column;vertical-align:top;width:min(45%,440px);margin:10px 18px 10px 0;gap:7px}input,select,textarea{border:1px solid #cbd5e1;border-radius:6px;font:inherit}textarea{display:block;width:100%;font-family:monospace}pre{max-height:320px;overflow:auto;background:#f6f8fa;padding:12px;border-radius:8px}.workflow-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.workflow-tabs button[aria-selected=true]{background:#23483d;color:white}.context{padding:12px 18px;background:#eaf1ee;border-radius:10px}.context label{font-size:14px}#status{font-weight:600}section[hidden]{display:none}@media(max-width:650px){body{padding:14px}section>label{width:100%;margin-right:0}.context input{width:100%}}
</style></head><body>
<header><h1>心肌病全病程工作台</h1><a href="/">返回知识引擎</a></header>
<p>从已审核的知识形成决策建议，记录复查任务、家系资料和处理反馈。医嘱建议保存在本地草稿，须由医生核对。</p>
<div class="context"><label>医院<input id="hospital" required></label><label>患者<input id="patient" required></label><label>操作人<input id="actor" required></label></div>
<nav class="workflow-tabs" aria-label="全病程场景"></nav><p id="status" role="status"></p>
<section><h2>场景覆盖与安全依据</h2><label>图谱文件<input id="graph" placeholder="KG-xxx.json"></label><label>疾病编码<input id="disease" placeholder="图谱中的疾病编码"></label><button data-action="coverage">查看覆盖</button><a href="/#review">打开诊疗依据审核台</a><div id="coverage"></div><p>治疗建议与禁忌、监测信息在下方共同显示；未完成的检查和映射会限制采纳。</p></section>
<section><h2>当前病历与治疗建议</h2><label>年龄<input id="age" type="number" min="0"></label><label>结构化病历<textarea id="snapshot" rows="7" cols="100" placeholder='{"exam_findings": [], "diagnoses": [], "clinical_attributes": {}}'>{"exam_findings": [], "diagnoses": [], "clinical_attributes": {}}</textarea></label><div class="actions"><button data-action="saveSnapshot">保存病程记录</button><button data-action="history">查看病程</button><button data-action="recommend">评估治疗建议</button><button data-action="listRecommendations">查看建议与反馈</button></div><div id="recommendations"></div><pre id="history"></pre></section>
<section><h2>风险评估</h2><p>仅执行有来源、版本和审核记录的已启用模型。当前支持显式线性积分模型，其他公式需独立实现和验证。</p><label>模型<select id="risk-model"><option value="">先加载模型</option></select></label><button data-action="loadModels">加载模型</button><button data-action="risk">评估</button><pre id="risk-result"></pre><details><summary>维护模型定义</summary><p>录入经核验的模型定义；启用须填写审核人与审核时间。不得用演示分值指导临床。</p><textarea id="model-definition" rows="10" cols="100" aria-label="模型定义"></textarea><button data-action="saveModel">保存模型版本</button></details></section>
<section><h2>复查与再评估</h2><label>复查内容<input id="follow-title"></label><label>计划时间<input id="follow-due" type="datetime-local"></label><label>依据<input id="follow-source"></label><label>复评事件（逗号分隔）<input id="follow-events" placeholder="result_ready,diagnosis_updated"></label><button data-action="saveFollow">添加复查任务</button><button data-action="listFollow">查看复查任务</button><div id="follow-ups"></div></section>
<section><h2>家系资料</h2><label>家系编号<input id="family"></label><label>成员编号<input id="member"></label><label>与先证者关系<input id="relationship"></label><label>家属患者编号<input id="member-patient"></label><label>变异描述<input id="variant"></label><label>解释版本<input id="variant-version"></label><label>变异分类<select id="classification"><option value="unknown">未知</option><option value="VUS">意义不明</option><option value="likely_pathogenic">可能致病</option><option value="pathogenic">致病</option><option value="likely_benign">可能良性</option><option value="benign">良性</option></select></label><label>遗传状态<select id="genetic"><option value="unknown">未知</option><option value="not_tested">未检测</option><option value="negative">阴性</option><option value="positive">阳性</option><option value="uncertain">不确定</option></select></label><label>检测依据<input id="family-source"></label><label><input type="checkbox" id="consent">已记录资料使用授权</label><button data-action="saveMember">保存成员</button><button data-action="listMembers">查看家系</button><pre id="family-result"></pre><p>家属筛查由医生明确指定；不会因意义不明变异自动创建。</p><label>筛查内容<input id="screen-title"></label><label>筛查时间<input id="screen-due" type="datetime-local"></label><button data-action="screenMember">为当前成员建立筛查任务</button></section>
<section><h2>院内医嘱映射</h2><label>知识条目编码<input id="order-code"></label><label>院内医嘱编码<input id="local-code"></label><label>名称<input id="order-name"></label><label>映射依据<input id="order-source"></label><label>状态<select id="mapping-status"><option value="draft">草稿</option><option value="active">已核对启用</option></select></label><button data-action="saveMapping">保存映射</button><button data-action="listMappings">查看映射</button><pre id="mapping-result"></pre></section>
<script src="/static/cardiomyopathy.js"></script></body></html>
